<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f2b84b" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0b10" stop-opacity="1"/>
      <stop offset="8%" stop-color="#0a0b10" stop-opacity="0"/>
      <stop offset="92%" stop-color="#0a0b10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#0a0b10"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#fadeEdge)"/>

  <!-- thin accent frame -->
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" fill="none" stroke="#f2b84b" stroke-width="1" opacity="0.35"/>

  <!-- vertical divider -->
  <line x1="760" y1="40" x2="760" y2="220" stroke="#f2b84b" stroke-width="1" opacity="0.5"/>

  <!-- left: equations -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f5f3ee">
    <text x="70" y="108" font-size="38" font-style="italic">S</text>
    <text x="102" y="108" font-size="34" font-style="normal" opacity="0.85">=</text>
    <text x="140" y="108" font-size="38" font-style="italic">A</text>
    <text x="177" y="108" font-size="34" opacity="0.85">/</text>
    <text x="197" y="108" font-size="38">4</text>
    <text x="224" y="108" font-size="38" font-style="italic">G</text>
    <text x="256" y="116" font-size="20" font-style="italic" opacity="0.8">N</text>
    <text x="380" y="108" font-size="16" font-style="normal" fill="#9a9488" letter-spacing="0.5">Bekenstein&#8211;Hawking entropy</text>

    <text x="70" y="180" font-size="38" font-style="italic">M</text>
    <text x="112" y="180" font-size="34" opacity="0.85">=</text>
    <text x="150" y="180" font-size="38" opacity="0.85">|</text>
    <text x="164" y="180" font-size="38" font-style="italic">Z</text>
    <text x="196" y="180" font-size="30">(</text>
    <text x="212" y="180" font-size="34" font-style="italic">&#947;</text>
    <text x="236" y="180" font-size="30">)</text>
    <text x="254" y="180" font-size="38" opacity="0.85">|</text>
    <text x="380" y="180" font-size="16" fill="#9a9488" letter-spacing="0.5">BPS mass bound</text>

    <text x="70" y="234" font-size="14" fill="#6e6a60" letter-spacing="1.5">QUANTUM GRAVITY &#183; STRING THEORY &#183; HOLOGRAPHIC DUALITY</text>
  </g>

  <!-- right: computing interests, terminal-style -->
  <g font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" fill="#f5f3ee">
    <text x="800" y="76" font-size="14" fill="#f2b84b" opacity="0.9">// computing</text>
    <text x="800" y="106" font-size="15" opacity="0.9">C++20/23 &#183; CUDA</text>
    <text x="800" y="132" font-size="15" opacity="0.9">MPI &#183; PBS &#183; HPC</text>
    <text x="800" y="158" font-size="15" opacity="0.9">FPGA edge inference</text>
    <text x="800" y="184" font-size="15" opacity="0.9">scientific ML</text>
    <text x="800" y="222" font-size="13" fill="#6e6a60">CERN STEAM Academy &#8217;26</text>
  </g>
